<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>My MoneyBud</title>
        <link rel="stylesheet" href="styles/style.css">
        <script type="module" src="scripts/apps.js"></script>
    </head>
    <body>
        <aside  
            //Link
            <h2>My MoneyBud</h2>
            <p style="margin-top: 20px; font-size:0.85rem">Nixon</p>
            <button onclick="exportJSON()" style="margin-top: 30px;">Export Data</button>
        </aside>

        <main id="main">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>My MoneyBud</h1>
                <button onclick="toggleModal(true)">Add Transaction</button>
            </div>

            <div class="grid">
                <div class="card dark">
                    <div style="color: #a3b8b0; font-size: 0.85rem;">Available Balance</div>
                    <div id="balance" style="font-size: 1.5rem; font-weight: bold;">$0</div>
                </div>
                <div class="card dark">
                    <div style="color: #a3b8b0; font-size: 0.85rem;">Total Income</div>
                    <div id="income" style="font-size: 1.5rem; font-weight: bold;">$0</div>
                </div>
                <div class="card dark">
                    <div style="color: #a3b8b0; font-size: 0.85rem;">Total Expenses</div>
                    <div id="expenses" style="font-size: 1.5rem; font-weight: bold;">$0</div>
                </div>
            </div>

            <div class="card">
                <div style="display: flex; justify-content:space-between; align-items:center;">
                    <input type="text" id="search" placeholder="Regex search (e.g Toys)" style="width: 250px;">
                    <label>Budget Cap ($): <input type="number" id="cap" style="width: 100px;"></label>
                </div>
                <div id="live-msg" role="status" style="margin-top: 10px; font-size: 0.85rem;"></div>
            </div>

            <div class="card">
                <h3>Transactions</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </main>

        <div class="modal" id="modal">
            <div class="modal-content">
                <h3>New Transaction</h3>
                <form id="form" style="display: flex; flex-direction: column; gap: 10px;" margin-top: 12px>
                    <input type="text" id="desc" placeholder="Description" required>
                    <input type="text" id="amount" placeholder="Amount" required>
                    <select id="cat">
                        <option value="Food">Food</option>
                        <option value="Books">Books</option>
                        <option value="Transport">Transport</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Income">Income</option>
                    </select>
                    <input type="date" id="date" required>
                    <span id="error" style="color: var(--danger); font-size: 0.75rem;"></span>
                    <div style="display: flex; justify-content: flex-end; gap: 8px;">
                        <button type="button" onclick="toggleModal(false)" style="background: #e5e7eb; color: #374151;">Cancel</button>
                        <button type="submit">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
